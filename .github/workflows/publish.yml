name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  market:
    # The harness's Plugins > Discover tab reads docs/market/index.json, and the versions it
    # lists must name a commit that is already pushed: the install spec is a pinned
    # `git+https://...#<commit>` clone, so an index generated before the tag lands would offer
    # an install nobody can fetch. There is nothing else to publish: the bundle is never sent
    # to a registry, and installing it is a git clone of this repository at that commit.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Check the tag matches the bundle version
        run: |
          version=$(node -e "process.stdout.write(require('./src/dkitchen-node/package.json').version)")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: node --test "tests/*.test.mjs"
        working-directory: src/dkitchen-node
      - name: Regenerate the plugin market index for this tag
        run: |
          # The tag's own commit is what a Discover install clones, so it is passed
          # explicitly instead of letting the generator read `main`'s HEAD.
          tag_commit=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          published=$(git show -s --format=%ct "$tag_commit")
          version=$(node -e "process.stdout.write(require('./src/dkitchen-node/package.json').version)")
          node scripts/market.mjs index \
            --commit "$tag_commit" --published "$published" --version "$version"
          node scripts/market.mjs index --check
      - name: Commit the index
        run: |
          if git diff --quiet -- docs/market/index.json; then
            echo "the index already lists $GITHUB_REF_NAME"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/market/index.json
          git commit -m "market: list $GITHUB_REF_NAME in the plugin market index"
          git push origin main
