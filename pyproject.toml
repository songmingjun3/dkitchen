[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dkitchen"
version = "0.5.0"
description = "A multi-agent workflow for research repos, with the ding CLI for driving DeepSeek Harness sessions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "917Dhj"}]
keywords = ["agents", "multi-agent", "deepseek-harness", "workflow", "research", "windows", "cli"]
dependencies = ["zstandard>=0.22,<1", "tomli>=1.1; python_version < '3.11'"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ding = "dkitchen.ding:main"

[project.urls]
Homepage = "https://github.com/917Dhj/dkitchen"
Documentation = "https://github.com/917Dhj/dkitchen/blob/main/docs/ding.md"
Repository = "https://github.com/917Dhj/dkitchen"
Issues = "https://github.com/917Dhj/dkitchen/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dkitchen = ["skills/**/*.md", "skills/**/*.py", "kitchen/**/*.md",
            "harness/**/*.json", "harness/**/*.yml", "harness/**/*.svg", "harness/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A Windows user name outside the ANSI code page makes the default temp root unreadable to
# pytest's own directory scan, so the suite keeps its scratch files inside the checkout.
addopts = "--basetemp=.pytest-tmp"
